name: Build SPTC Support Drawings DLL

on:
  push:
    branches: [main]
    paths:
      - 'src/SPTC.SupportDrawings/**'
      - 'tests/SupportSheetSmokeTests/**'
      - '.github/workflows/build-support-drawings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-dotnet@v4
        name: Install .NET 8 SDK
        with:
          dotnet-version: '8.0.x'
      - name: Test support sheet sizing calculations
        run: dotnet run --project tests/SupportSheetSmokeTests/SupportSheetSmokeTests.csproj -c Release
      - name: Verify REV06 cross-database layer regression fix
        shell: pwsh
        run: |
          $src = Get-Content 'src/SPTC.SupportDrawings/Support2DExporter.cs' -Raw
          if ($src -notmatch 'line\.LayerId\s*=\s*layerId\s*;') { throw 'REV06 LayerId assignment missing' }
          if ($src -match '\{\s*Layer\s*=\s*layer\s*\}') { throw 'REV05 detached Layer name assignment remains' }
      - name: Verify REV08 native Plant 3D Ortho command handoff
        shell: pwsh
        run: |
          $src = Get-Content 'src/SPTC.SupportDrawings/SupportDrawingCommands.cs' -Raw
          if ($src -notmatch 'CommandMethod\("SPTC_SUPPORT2D"') { throw 'Native Ortho command entry missing' }
          if ($src -notmatch 'SendStringToExecute\("_.PLANTORTHOCREATE ') { throw 'Native Ortho handoff missing' }
          if ($src -notmatch 'CommandMethod\("SPTC_SUPPORT2DLINEWORK"') { throw 'Legacy linework command missing' }
          if ($src -notmatch 'CommandMethod\("SPTC_SUPPORT2DBATCH"') { throw 'Legacy batch command missing' }
      - name: Verify REV09 native Ortho API probe is read-only
        shell: pwsh
        run: |
          $src = Get-Content 'src/SPTC.SupportDrawings/SupportNativeOrthoProbe.cs' -Raw
          if ($src -notmatch 'CommandMethod\("SPTC_ORTHOAUTOPROBE"') { throw 'Ortho API probe command missing' }
          if ($src -match 'SendStringToExecute|\.Explode\(|\.SaveAs\(') { throw 'Probe must not mutate or queue Ortho commands' }
      - name: Verify REV10 source-model plan is read-only
        shell: pwsh
        run: |
          $src = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoStagingCommands.cs' -Raw
          if ($src -notmatch 'CommandMethod\("SPTC_ORTHOAUTOPLAN"') { throw 'Ortho plan command missing' }
          if ($src -match 'SendStringToExecute|\.SaveAs\(|\.Explode\(') { throw 'Ortho plan must not modify Plant project DWG' }
      - name: Verify REV11 per-axis cube and read-only registration check
        shell: pwsh
        run: |
          $layout = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoLayout.cs' -Raw
          if ($layout -notmatch 'double padY\s*=') { throw 'Per-axis narrow support clearance missing' }
          $check = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoProjectCheck.cs' -Raw
          if ($check -notmatch 'IsValid3dDrawing') { throw 'Native source registration API check missing' }
          if ($check -match 'AddPnPDrawingFile\(') { throw 'Preflight must never add project drawings' }
      - name: Verify REV12 Piping project registration API fix
        shell: pwsh
        run: |
          $check = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoProjectCheck.cs' -Raw
          if ($check -notmatch 'new object\[\] \{ "Piping" \}') { throw 'Piping project part lookup missing' }
          if ($check -notmatch 'object\?\[\] parameters = \{sourceDwg, piping, ""\};') { throw 'IsValid3dDrawing must receive Piping part' }
          if ($check -match 'IsInstanceOfType\(project\)') { throw 'Old PlantProject type mismatch still present' }
          if ($check -match 'AddPnPDrawingFile\(') { throw 'Validation must not mutate project registration' }
          $stage = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoStagingCommands.cs' -Raw
          if ($stage -notmatch 'NativeValidationApiSignature') { throw 'Validation method signature not reported in JSON' }
      - name: Verify REV13 model-agnostic source and report naming
        shell: pwsh
        run: |
          $code = Get-ChildItem 'src/SPTC.SupportDrawings' -Filter '*.cs' -File |
            ForEach-Object { Get-Content $_.FullName -Raw }
          foreach ($fixed in @('TOSHIBA', 'TEST3.dwg', 'SAMPLE_2ND STAGE.dwg',
                               '8D1', '8D2', '3EC', '3EA')) {
            foreach ($file in $code) {
              if ($file.Contains($fixed)) { throw "Hard-coded source-model detail found: $fixed" }
            }
          }
          $plan = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoStagingCommands.cs' -Raw
          if ($plan -notmatch 'SuggestedPlanFileName\(drawing, handles, "REV13"\)') {
            throw 'JSON report naming must depend on active source model and selected handles'
          }
          if ($plan -notmatch 'SourceSelectionMode') { throw 'Dynamic selection mode must be recorded' }
          $native = Get-Content 'src/SPTC.SupportDrawings/SupportDrawingCommands.cs' -Raw
          if ($native -notmatch 'NativeOrthoProjectCheck.Inspect\(doc.Database.Filename\)') {
            throw 'SPTC_SUPPORT2D must inspect current active model'
          }
      - name: Verify REV14 native project registration safety
        shell: pwsh
        run: |
          $reg = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoRegistrationTest.cs' -Raw
          if ($reg -notmatch 'CommandMethod\("SPTC_ORTHO14REGISTER_TEST"') { throw 'Separate test-only command missing' }
          if ($reg -notmatch 'NativeOrthoProjectCheck.Inspect\(model\)') { throw 'Current source registration check missing' }
          if ($reg -notmatch 'TEST PROJECT') { throw 'Explicit backup-project confirmation missing' }
          if ($reg -notmatch 'SetOrthoDwgVersion') { throw 'Native Ortho version API integration missing' }
          if ($reg -notmatch 'AddPnPDrawingFile') { throw 'Native Ortho drawing registration API missing' }
          if ($reg -notmatch 'IsValidOrthoDrawing') { throw 'Native Ortho validation API missing' }
          if ($reg -match 'GenerateOrthos\(|\.ExecuteNonQuery\(|SQLiteConnection') { throw 'No internal generation or raw DCF writes allowed in test' }
          $old = Get-Content 'src/SPTC.SupportDrawings/SupportDrawingCommands.cs' -Raw
          if ($old -notmatch 'CommandMethod\("SPTC_SUPPORT2D"') { throw 'Existing production command must remain available' }
      - name: Verify REV15 wizard-seed clone test is isolated
        shell: pwsh
        run: |
          $seed = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoSeedCloneTest.cs' -Raw
          if ($seed -notmatch 'CommandMethod\("SPTC_ORTHO15CLONE_TEST"') { throw 'REV15 seed clone test command missing' }
          if ($seed -notmatch 'NATIVE ORTHO TEST') { throw 'Backup project confirmation missing' }
          if ($seed -notmatch 'IsValidOrthoDrawing') { throw 'Native Ortho project validation missing' }
          if ($seed -notmatch 'AddPnPDrawingFile') { throw 'Native Ortho registration missing' }
          if ($seed -notmatch 'File.Exists\(dest\)') { throw 'Existing output overwrite guard missing' }
          if ($seed -match 'SetOrthoDwgVersion|GenerateOrthos\(|SQLiteConnection|ExecuteNonQuery') {
            throw 'REV15 must not use unverified version setter or internal generator or edit DCF directly'
          }
          $base = Get-Content 'src/SPTC.SupportDrawings/SupportDrawingCommands.cs' -Raw
          if ($base -notmatch 'CommandMethod\("SPTC_SUPPORT2D"') { throw 'SPTC_SUPPORT2D must remain available' }
      - name: Verify REV16 native Ortho seed folder and empty-view safeguards
        shell: pwsh
        run: |
          $src = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoSeedCloneTest.cs' -Raw
          if ($src -notmatch 'CommandMethod\("SPTC_ORTHO16CLONE_TEST"') { throw 'Corrected REV16 test command missing' }
          if ($src -notmatch 'CommandMethod\("SPTC_ORTHO15CLONE_TEST"') { throw 'Legacy test alias missing' }
          if ($src -notmatch 'IsInsideProjectDirectory\(seed, info.OrthoFolder\)') { throw 'Native Ortho subfolder guard missing' }
          if ($src -notmatch 'Path.GetDirectoryName\(seed\)!') { throw 'Clone must be saved beside original native Ortho seed' }
          if ($src -notmatch 'GetAllViewNamesInOrthoDwgByGuid') { throw 'Read-only native Ortho view list preflight missing' }
          if ($src -notmatch 'NO_VIEWS_FOUND') { throw 'Unknown or occupied seed must stop clone test' }
          if ($src -match 'SetOrthoDwgVersion|GenerateOrthos\(|SQLiteConnection|ExecuteNonQuery') {
            throw 'Unverified version setter, non-public generation or direct project database mutation forbidden'
          }
      - name: Verify REV17 TOP view preflight never generates or overwrites project Ortho
        shell: pwsh
        run: |
          $probe = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopPreflight.cs' -Raw
          if ($probe -notmatch 'CommandMethod\("SPTC_ORTHO17_TOP_PREFLIGHT"') { throw 'REV17 TOP probe command missing' }
          if ($probe -notmatch 'NativeOrthoProjectCheck.Inspect\(source\)') { throw 'Must inspect current registered source' }
          if ($probe -notmatch 'IsInsideProjectDirectory\(target, part.OrthoRoot\)') { throw 'Must validate target Ortho folder' }
          if ($probe -notmatch 'ReadPaper\(target\)') { throw 'Must inspect actual native sheet size' }
          if ($probe -notmatch 'NativeOrthoTopViewPlan.Build') { throw 'Must plan actual paper-based TOP placement' }
          if ($probe -match '\.SaveAs\(|SendStringToExecute|SQLiteConnection|ExecuteNonQuery|\.Invoke\([^\n]*GenerateOrthos') {
            throw 'REV17 may not save native drawings, drive UI or call unsupported generators'
          }
          $layout = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopViewPlan.cs' -Raw
          if ($layout -notmatch 'PROPOSED_ONLY:') { throw 'Candidate placement must not be advertised as verified' }
      - name: Verify REV18 public TOP generation test backup safety
        shell: pwsh
        run: |
          $code = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopGenerationTest.cs' -Raw
          if ($code -notmatch 'CommandMethod\("SPTC_ORTHO18_TOP_API_TEST"') { throw 'REV18 isolated command missing' }
          if ($code -notmatch 'NativeOrthoProjectCheck.Inspect\(model\)') { throw 'Source Piping registration check missing' }
          if ($code -notmatch 'EMPTY_REGISTERED_ORTHO') { throw 'Empty registered Ortho target safeguard missing' }
          if ($code -notmatch '_ORTHO_R16CLONE_') { throw 'Test only on new REV16 cloned drawing' }
          if ($code -notmatch 'InitializeCube') { throw 'Real native OrthoCube initialization missing' }
          if ($code -notmatch 'MakeCubeCopy') { throw 'Native 3D cube Solid extraction missing' }
          if ($code -notmatch 'TOP API TEST') { throw 'Explicit copied-project write confirmation missing' }
          if ($code -notmatch 'STEP5_PUBLIC_CREATEORTHOS_ENTERED') { throw 'Public CreateOrthos test missing' }
          if ($code -notmatch 'PUBLIC_API_STILL_INTERACTIVE=TRUE') { throw 'Viewport placement must not be reported unattended' }
          if ($code -match 'BindingFlags.NonPublic|GetMethod\("GenerateOrthos"|SendStringToExecute|SQLiteConnection|ExecuteNonQuery') {
            throw 'No private Ortho generation, UI script or direct project database edits in REV18'
          }
          $prev = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoSeedCloneTest.cs' -Raw
          if ($prev -notmatch 'CommandMethod\("SPTC_ORTHO16CLONE_TEST"') { throw 'Working REV16 clone command must remain' }
      - name: Verify REV19 one-command native TOP cloned-drawing safety
        shell: pwsh
        run: |
          $src = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopOneCommandTest.cs' -Raw
          if ($src -notmatch 'CommandMethod\("SPTC_ORTHO19_TOP_ONECMD_TEST"') { throw 'REV19 isolated command missing' }
          if ($src -notmatch 'CommandFlags.Session') { throw 'Cross-document command requires session context' }
          if ($src -notmatch 'NativeOrthoProjectCheck.Inspect\(source\)') { throw 'Must verify active model is registered' }
          if ($src -notmatch 'NativeOrthoRegistrationNames.IsInsideProjectDirectory\(seed, part.OrthoFolder\)') { throw 'Native empty Ortho seed location guard missing' }
          if ($src -notmatch 'EMPTY_REGISTERED_ORTHO') { throw 'Native view catalog empty check missing' }
          if ($src -notmatch 'IsNativeOrthoValid\(part.OrthoPart, dest\)') { throw 'New project drawing validation missing' }
          if ($src -notmatch 'REV19 TEST') { throw 'Explicit backup-project test consent missing' }
          if ($src -notmatch 'DocumentManager.Open\(dest, false\)') { throw 'New Ortho document activation missing' }
          if ($src -notmatch 'InitializeCube') { throw 'Native OrthoCube init missing' }
          if ($src -notmatch 'MakeCubeCopy') { throw 'Native OrthoCube solid missing' }
          if ($src -notmatch 'CreateOrthos') { throw 'Public native TOP generation missing' }
          if ($src -match 'BindingFlags.NonPublic|GetMethod\("GenerateOrthos"|SetOrthoDwgVersion|SendStringToExecute|SQLiteConnection|ExecuteNonQuery') {
            throw 'REV19 may not call private generation, write DCF, or automate UI'
          }
          $legacy = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopGenerationTest.cs' -Raw
          if ($legacy -notmatch 'CommandMethod\("SPTC_ORTHO18_TOP_API_TEST"') { throw 'Working REV18 command must remain unchanged' }
      - name: Verify REV19.1 eFileSharingViolation native DWG clone fix
        shell: pwsh
        run: |
          $code = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopOneCommandTest.cs' -Raw
          if ($code -notmatch 'ReadDwgFile\(seed, FileOpenMode.OpenForReadAndAllShare, true, null\)') { throw 'Native seed clone must use Autodesk all-share FileOpenMode' }
          if ($code -notmatch 'db.CloseInput\(true\)') { throw 'Clone must close lazy-loaded source input' }
          if ($code -notmatch 'db.SaveAs\(dest, DwgVersion.Current\)') { throw 'Clone must still be saved as native DWG' }
          if ($code -match 'db.ReadDwgFile\(seed, FileShare.Read,') { throw 'FileShare.Read overload caused REV19 sharing violation' }
      - name: Verify REV19.3 native Ortho document-context handoff
        shell: pwsh
        run: |
          $src = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopOneCommandTest.cs' -Raw
          if ($src -notmatch 'public async void Run\(\)') { throw 'REV19.3 Session command must yield to target document context' }
          if ($src -notmatch 'ExecuteInCommandContextAsync') { throw 'Target command-context handoff missing' }
          if ($src -notmatch 'HostApplicationServices.WorkingDatabase') { throw 'Working DB diagnostic missing' }
          if ($src -notmatch 'STEP5_TARGET_CONTEXT_ACTIVE_DOC_MATCH') { throw 'Document context identity check missing' }
          if ($src -notmatch 'STEP5_TARGET_CONTEXT_WORKING_DB_MATCH') { throw 'Working DB identity check missing' }
          if ($src -notmatch 'STEP5_NATIVE_CUBE_EXTENTS_MATCHED') { throw 'Native cube must remain strictly verified' }
          if ($src -notmatch 'NATIVE_DOCUMENT_CONTEXT_ERROR') { throw 'Native delegate must catch and log errors' }
          if ($src -match 'GetMethod\("GenerateOrthos"|BindingFlags.NonPublic|SetOrthoDwgVersion|ExecuteNonQuery|SendStringToExecute') {
            throw 'Private native generation and project database writes remain forbidden'
          }
      - name: Verify REV19.4 working-database identity and synchronization fix
        shell: pwsh
        run: |
          $code = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopOneCommandTest.cs' -Raw
          if ($code -notmatch 'STEP5_WORKING_DB_BEFORE=') { throw 'Missing current working DB filename diagnostic' }
          if ($code -notmatch 'STEP5_EXPECTED_WORKING_DB=') { throw 'Missing target DB filename diagnostic' }
          if ($code -notmatch 'STEP5_WORKING_DB_WRAPPER_EQUALS=') { throw 'Missing wrapper identity diagnostic' }
          if ($code -notmatch 'STEP5_WORKING_DB_SYNC_ENTERED') { throw 'Missing explicit target DB synchronization' }
          if ($code -notmatch 'HostApplicationServices.WorkingDatabase = targetDoc.Database') { throw 'Must set working DB to verified target before native cube init' }
          if ($code -notmatch 'STEP5_WORKING_DB_VERIFIED_TARGET') { throw 'Must verify effective working DB filename' }
          if ($code -notmatch 'STEP5_WORKING_DB_FINAL_SYNC') { throw 'Must synchronize working DB after native call' }
          if ($code -notmatch 'STEP5_NATIVE_CUBE_EXTENTS_MATCHED') { throw 'Strict native OrthoCube bounds check removed' }
          if ($code -match 'SetOrthoDwgVersion|GetMethod\("GenerateOrthos"|BindingFlags.NonPublic|ExecuteNonQuery|SQLiteConnection|SendStringToExecute') {
            throw 'REV19.4 must preserve public-only native Ortho generation and registration'
          }
      - name: Verify REV20 separate native TOP FRONT SIDE experiment
        shell: pwsh
        run: |
          $code = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoThreeViewOneCommandTest.cs' -Raw
          $plan = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoThreeViewPlan.cs' -Raw
          if ($code -notmatch 'CommandMethod\("SPTC_ORTHO20_THREEVIEW_ONECMD_TEST"') { throw 'REV20 isolated command missing' }
          if ($code -notmatch 'REV20 TEST') { throw 'REV20 copied-project consent missing' }
          if ($code -notmatch 'ExecuteInCommandContextAsync') { throw 'Target document context missing' }
          if ($code -notmatch 'STEP5_WORKING_DB_VERIFIED_TARGET') { throw 'REV19.4 working database guard missing' }
          if ($code -notmatch 'CUBE_EXTENTS_MATCHED') { throw 'Strict native cube match missing' }
          if ($code -notmatch 'NativeOrthoThreeViewPlan.Build') { throw 'Sheet-aware view planning missing' }
          if ($code -notmatch 'STEP10_TOP_FRONT_SIDE_NATIVE_REGISTERED') { throw 'Three view registration missing' }
          if ($code -notmatch 'CatalogMatches') { throw 'Catalog validation missing' }
          if ($code -notmatch 'PaperViewports') { throw 'Post-placement inspection missing' }
          if ($plan -notmatch 'PROPOSED_ONLY:') { throw 'Unenforced placement cannot be advertised as guaranteed' }
          if ($code -match 'BindingFlags.NonPublic|GetMethod\("GenerateOrthos"|SQLiteConnection|ExecuteNonQuery|SendStringToExecute') {
            throw 'REV20 must use only public Ortho API'
          }
          $baseline = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopOneCommandTest.cs' -Raw
          if ($baseline -notmatch 'CommandMethod\("SPTC_ORTHO19_TOP_ONECMD_TEST"') { throw 'Validated REV19.4 command must remain' }
      - name: Verify REV21 unsupported internal generation is isolated and guarded
        shell: pwsh
        run: |
          $src = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoOneClickInternalTest.cs' -Raw
          $plan = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoOneClickPlan.cs' -Raw
          $baseline = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoThreeViewOneCommandTest.cs' -Raw
          $top = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTopOneCommandTest.cs' -Raw
          if ($src -notmatch 'CommandMethod\("SPTC_ORTHO21_ONECLICK_INTERNAL_TEST"') { throw 'Separate REV21 command missing' }
          if ($src -notmatch 'REV21 TEST') { throw 'Copied-project explicit authorization missing' }
          if ($src -notmatch 'ExecuteInCommandContextAsync') { throw 'Native target drawing command context missing' }
          if ($src -notmatch 'STEP5_WORKING_DB_VERIFIED_TARGET') { throw 'Working database matching missing' }
          if ($src -notmatch 'NonPublic\|BindingFlags.Instance') { throw 'Explicit experimental internal method lookup missing' }
          if ($src -notmatch 'expectedNativeSignature') { throw 'Exact internal method signature gate missing' }
          if ($src -notmatch 'STEP5_UNSUPPORTED_GENERATE_SIGNATURE_MATCH') { throw 'Internal signature fail-closed guard missing' }
          if ($src -notmatch 'NativeOrthoOneClickPlan.Build') { throw 'One-click anchor spacing guard missing' }
          if ($src -notmatch 'PromptPointOptions') { throw 'Exactly one TOP anchor point required' }
          if ($src -notmatch 'CreateExperimentalViewport') { throw 'Native paper viewport ObjectId creation missing' }
          if ($src -notmatch 'PRIVATE_GENERATEORTHOS_ENTERED') { throw 'Internal invocation not logged' }
          if ($src -notmatch 'CatalogMatches') { throw 'Exact native view registration checks missing' }
          if ($src -notmatch 'CUBE_EXTENTS_MATCHED') { throw 'Native cube geometry verification missing' }
          if ($src -match 'SQLiteConnection|ExecuteNonQuery|SendStringToExecute|SetOrthoDwgVersion') {
            throw 'REV21 must not edit project database directly or script clicks'
          }
          if ($plan -notmatch 'paperHeight\*\.12' -or $plan -notmatch 'paperWidth\*\.78') { throw 'Title-block keepout guard missing' }
          if ($baseline -notmatch 'CommandMethod\("SPTC_ORTHO20_THREEVIEW_ONECMD_TEST"') { throw 'REV20 working fallback modified' }
          if ($top -notmatch 'CommandMethod\("SPTC_ORTHO19_TOP_ONECMD_TEST"') { throw 'REV19.4 working fallback modified' }
      - name: Verify REV21.1 single-click automatic group translation
        shell: pwsh
        run: |
          $plan = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoOneClickPlan.cs' -Raw
          $code = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoOneClickInternalTest.cs' -Raw
          $previous = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoThreeViewOneCommandTest.cs' -Raw
          if ($plan -notmatch 'BuildAdjusted') { throw 'Missing automatic full-group anchor translation' }
          if ($plan -notmatch 'Math.Clamp') { throw 'Anchor must clamp to feasible interval' }
          if ($plan -notmatch 'minimumX>maximumX') { throw 'Missing fail-closed impossible-fit guard' }
          if ($plan -notmatch 'IReadOnlyList<Placement> views=Build') { throw 'Strict original collision validation must remain' }
          if ($code -notmatch 'STEP5_ONE_CLICK_GROUP_TRANSLATION') { throw 'Original versus effective click must be logged' }
          if ($code -notmatch 'STEP5_ONE_CLICK_AUTO_SHIFTED') { throw 'Auto-shift status missing' }
          if ($code -notmatch 'NativeOrthoOneClickPlan.BuildAdjusted') { throw 'Native generator not using adjusted group' }
          if ($code -notmatch 'STEP5_UNSUPPORTED_GENERATE_SIGNATURE_MATCH') { throw 'Internal API signature check must remain' }
          if ($code -notmatch 'STEP9_.*_VIEW_CATALOG') { throw 'Native registration checks must remain' }
          if ($previous -notmatch 'CommandMethod\("SPTC_ORTHO20_THREEVIEW_ONECMD_TEST"') { throw 'Working REV20 command changed' }
      - name: Verify REV22 all ten views and safe separate one-click command
        shell: pwsh
        run: |
          $code = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewOneClickTest.cs' -Raw
          $plan = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewPlan.cs' -Raw
          foreach($type in @('Top','Bottom','Left','Right','Front','Back','NW','NE','SW','SE')) {
            if ($plan -notmatch ('"'+$type+'"')) { throw "REV22 missing native view $type" }
          }
          if ($code -notmatch 'CommandMethod\("SPTC_ORTHO22_TENVIEW_ONECLICK_TEST"') { throw 'REV22 separate command missing' }
          if ($code -notmatch 'REV22 TEST') { throw 'Missing copied-project confirmation' }
          if ($code -notmatch 'STEP5_ONE_CLICK_COUNT=1') { throw 'One-click anchor missing' }
          if ($code -notmatch 'NativeOrthoTenViewPlan.BuildAdjusted') { throw '10-view auto-fit missing' }
          if ($code -notmatch 'STEP10_ALL_TEN_NATIVE_VIEWS_REGISTERED') { throw 'Full view catalog verification missing' }
          if ($code -match 'views.Keys.Take\(8\)') { throw 'Do not truncate the ten native view names' }
          if ($code -notmatch 'STEP5_UNSUPPORTED_GENERATE_SIGNATURE_MATCH') { throw 'Internal native API signature guard missing' }
          if ($code -notmatch 'CUBE_EXTENTS_MATCHED') { throw 'Native geometry strict checks missing' }
          if ($code -notmatch 'STEP5_WORKING_DB_VERIFIED_TARGET') { throw 'Native target context guard missing' }
          if ($code -match 'SQLiteConnection|ExecuteNonQuery|SendStringToExecute|SetOrthoDwgVersion') { throw 'Direct project metadata modification or UI scripts forbidden' }
          if ($plan -notmatch 'PROPOSED_ONLY') { throw 'Native Update View validation disclaimer missing' }
          $previous = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoOneClickInternalTest.cs' -Raw
          $public = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoThreeViewOneCommandTest.cs' -Raw
          if ($previous -notmatch 'CommandMethod\("SPTC_ORTHO21_ONECLICK_INTERNAL_TEST"') { throw 'REV21 fallback missing' }
          if ($public -notmatch 'CommandMethod\("SPTC_ORTHO20_THREEVIEW_ONECMD_TEST"') { throw 'REV20 fallback missing' }
      - name: Verify REV22.1 fixed isometric Current View fallback
        shell: pwsh
        run: |
          $code = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewIsoFixTest.cs' -Raw
          $helper = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoIsoViewType.cs' -Raw
          $original = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewOneClickTest.cs' -Raw
          if ($code -notmatch 'CommandMethod\("SPTC_ORTHO22_1_ISO_FIX_TEST"') { throw 'REV22.1 independent command missing' }
          if ($code -notmatch 'REV22.1 TEST') { throw 'Explicit backup-project consent missing' }
          if ($code -notmatch 'NativeOrthoIsoViewType.Resolve') { throw 'Native iso type normalization missing' }
          if ($code -notmatch 'NATIVE_TYPE_NAME=') { throw 'Native iso string not logged' }
          if ($code -notmatch 'ISOMETRIC_CAMERA_MATCH_BEFORE') { throw 'Isometric view camera must be validated before native generate' }
          if ($code -notmatch 'ISOMETRIC_CAMERA_MATCH_AFTER') { throw 'Isometric camera must be audited after native generate' }
          if ($code -notmatch 'STEP5_UNSUPPORTED_GENERATE_SIGNATURE_MATCH') { throw 'Private native signature check missing' }
          if ($code -notmatch 'CUBE_EXTENTS_MATCHED') { throw 'Strict native OrthoCube checks missing' }
          if ($code -notmatch 'CatalogMatches') { throw 'Native model view registration checks missing' }
          if ($code -match 'SQLiteConnection|ExecuteNonQuery|SendStringToExecute|SetOrthoDwgVersion') { throw 'Direct metadata edits or UI scripting prohibited' }
          if ($original -notmatch 'CommandMethod\("SPTC_ORTHO22_TENVIEW_ONECLICK_TEST"') { throw 'Original REV22 command modified' }
          foreach($iso in @('NW','NE','SW','SE')) {
            if ($helper -notmatch ('"'+$iso+'" => "'+$iso+'Isometric"')) { throw "Missing canonical native view identifier $iso" }
          }
          if ($helper -match 'NWIsometricView|NEIsometricView|SWIsometricView|SEIsometricView') {
            # Previous names may appear in documentation comments, but not in switch mappings.
            if ($helper -match '"NW" => "NWIsometricView"|"NE" => "NEIsometricView"|"SW" => "SWIsometricView"|"SE" => "SEIsometricView"') {
              throw 'Legacy iso type name still used'
            }
          }
      - name: Verify REV22.2 exact native Edit View preset metadata
        shell: pwsh
        run: |
          $code = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewMetadataFixTest.cs' -Raw
          $preset = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoEditorPreset.cs' -Raw
          $old = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewIsoFixTest.cs' -Raw
          foreach($iso in @('NW','NE','SW','SE')) {
            if ($preset -notmatch ('"'+$iso+'" => "'+$iso+'"')) { throw "REV22.2 missing short preset $iso" }
          }
          if ($code -notmatch 'CommandMethod\("SPTC_ORTHO22_2_EDITVIEW_FIX_TEST"') { throw 'Separate new command absent' }
          if ($code -notmatch 'REV22.2 TEST') { throw 'Copied-project explicit consent absent' }
          if ($code -notmatch 'NativeOrthoEditorPreset.Resolve') { throw 'Native persisted short names not used' }
          if ($code -notmatch 'GetViewTypeFromName') { throw 'Native Editor preset parser preflight missing' }
          if ($code -notmatch 'SAVED_VIEWDEF_TYPE') { throw 'Native saved view-definition type check missing' }
          if ($code -notmatch 'GetDwgSheetFromOrthoView') { throw 'Missing native read-only sheet readback' }
          if ($code -notmatch 'GetViewDefByViewName') { throw 'Missing native read-only view definition readback' }
          if ($code -notmatch 'SAVED_TYPE_CHECK') { throw 'Missing metadata check result' }
          if ($code -notmatch 'ISOMETRIC_CAMERA_MATCH_AFTER') { throw 'Must retain viewport camera validation' }
          if ($code -notmatch 'STEP5_UNSUPPORTED_GENERATE_SIGNATURE_MATCH') { throw 'Must retain exact private signature gate' }
          if ($code -notmatch 'STEP5_WORKING_DB_VERIFIED_TARGET') { throw 'Must retain target document protection' }
          if ($code -notmatch 'CUBE_EXTENTS_MATCHED') { throw 'Must retain strict native cube bounds' }
          if ($code -notmatch 'CatalogMatches') { throw 'Must verify native view registration' }
          if ($code -match 'SQLiteConnection|ExecuteNonQuery|SendStringToExecute|SetOrthoDwgVersion') { throw 'Direct project DB changes prohibited' }
          if ($old -notmatch 'CommandMethod\("SPTC_ORTHO22_1_ISO_FIX_TEST"') { throw 'REV22.1 must remain available unchanged' }
      - name: Compile SPTC Support Drawings
        run: dotnet build src/SPTC.SupportDrawings/SPTC.SupportDrawings.csproj -c Release
      - name: Verify compiled DLL
        shell: pwsh
        run: |
          $dll = 'src/SPTC.SupportDrawings/bin/Release/net8.0-windows/SPTC.SupportDrawings.dll'
          if (!(Test-Path $dll)) { throw 'Compiled DLL was not created.' }
          Get-Item $dll | Select-Object FullName, Length
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPTC-SupportDrawings-Plant3D2025-REV22_2
          path: src/SPTC.SupportDrawings/bin/Release/net8.0-windows/SPTC.SupportDrawings.dll
          retention-days: 30
          if-no-files-found: error
