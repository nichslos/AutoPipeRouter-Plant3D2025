name: Build SPTC Production Iso DLL

on:
  push:
    branches: [main]
    paths:
      - 'src/SPTC.ProductionIso/**'
      - '.github/workflows/build-production-iso.yml'
  pull_request:
    paths:
      - 'src/SPTC.ProductionIso/**'
      - '.github/workflows/build-production-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 SDK on GitHub runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Production Iso plugin
        run: dotnet build src/SPTC.ProductionIso/SPTC.ProductionIso.csproj --configuration Release
      - name: Confirm DLL exists
        shell: pwsh
        run: |
          $path = 'src/SPTC.ProductionIso/bin/Release/net8.0-windows/SPTC.ProductionIso.dll'
          if (-not (Test-Path $path)) { throw "DLL not found at $path" }
      - name: Package DLL only
        uses: actions/upload-artifact@v4
        with:
          name: SPTC-ProductionIso-2025-DLL
          path: src/SPTC.ProductionIso/bin/Release/net8.0-windows/SPTC.ProductionIso.dll
          if-no-files-found: error
